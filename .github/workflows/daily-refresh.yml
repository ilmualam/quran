# Rebuilds the date-dependent pages once a day just after midnight in Malaysia, so the pre-rendered "hari ini" content
# (Hijri date on /kalendar-hijrah/, today's prayer times on /waktu-solat/ and /cari-masjid/ zone pages, Ramadan countdown)
# is right for crawlers and for visitors without JavaScript. Data files are not fetched here; see solat-data.yml and masjid-data.yml.
name: Daily refresh (hari ini)
on:
  schedule:
    - cron: "7 16 * * *"   # 00:07 MYT
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-sync-${{ github.ref }}  # shared with the data syncs: one data commit at a time
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}  # the branch tip when this job starts (jobs queue in data-sync), not the triggering commit, so the push fast-forwards
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild for today (MYT)
        run: SOLAT_DATE="$(TZ=Asia/Kuala_Lumpur date +%F)" python3 tools/build.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add waktu-solat waktu-berbuka-puasa cari-masjid kalendar-hijrah solat-sunat solat-jamak-qasar sw.js llms.txt sitemap.xml assets/data/cari.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily refresh ($(TZ=Asia/Kuala_Lumpur date +%F))"
          git push
