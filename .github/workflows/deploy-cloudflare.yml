name: Deploy to Cloudflare (Workers static assets)

# Manual fallback only. Production deploys are done by Cloudflare Workers Builds (Cloudflare dashboard → Workers & Pages →
# quran-ilmualam → Settings → Builds), which builds and deploys every push to main, including the data/refresh workflows'
# commits, with no API token stored in GitHub. Run this by hand only if Builds is unavailable; it needs the repository
# secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to be valid.
on:
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack site into dist/
        run: tools/cf/pack.sh
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.162.0 deploy
