name: Deploy to Cloudflare (Workers static assets)

# Manual fallback only. Production deploys come from Cloudflare Workers Builds (Git integration on the quran-ilmualam
# Worker: build `bash tools/cf/pack.sh`, deploy `npx wrangler deploy`, branch main), which runs on every push,
# including the bot pushes of the data/refresh workflows, and needs no API token.
# To use this workflow, set the repository secrets CLOUDFLARE_API_TOKEN (a 40-character API token, not the Global
# API Key; never "rolled" after saving) and CLOUDFLARE_ACCOUNT_ID, then run it from the Actions tab.
on:
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack site into dist/
        run: tools/cf/pack.sh
      - name: Deploy
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # secrets pasted from a phone often carry spaces, line breaks, quotes or a "Bearer " prefix: strip them
          T="$(printf %s "$RAW_TOKEN" | tr -d '[:space:]"' | sed 's/^Bearer//')"
          A="$(printf %s "$RAW_ACCOUNT" | tr -d '[:space:]"')"
          echo "token length ${#T} (API tokens are 40), account id length ${#A} (32)"
          echo -n "user-token check: "; curl -s -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c '{success, status: .result.status, errors: [.errors[]?.message]}'
          echo -n "account-token check: "; curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A/tokens/verify" | jq -c '{success, status: .result.status, errors: [.errors[]?.message]}'
          echo "token starts with letters: $(printf %s "$T" | head -c 4 | tr -c 'A-Za-z_' '*' | sed 's/[A-Za-z]/a/g')"
          CLOUDFLARE_API_TOKEN="$T" CLOUDFLARE_ACCOUNT_ID="$A" npx --yes wrangler@4.162.0 deploy
