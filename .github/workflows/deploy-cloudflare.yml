name: Deploy to Cloudflare (Workers static assets)

# Deploys the committed site to the quran-ilmualam Worker. Pushes made by the data/refresh workflows use GITHUB_TOKEN,
# which does not fire "push" events, so those workflows trigger a deploy through workflow_run instead.
# Needs the repository secrets CLOUDFLARE_API_TOKEN (an API token, not the Global API Key; never "rolled" after saving)
# and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Daily refresh (hari ini)", "Prayer times (JAKIM)", "Masjid & surau (OpenStreetMap)"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack site into dist/
        run: tools/cf/pack.sh
      - name: Deploy
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # secrets pasted from a phone often carry spaces, line breaks, quotes or a "Bearer " prefix: strip them
          T="$(printf %s "$RAW_TOKEN" | tr -d '[:space:]"' | sed 's/^Bearer//')"
          A="$(printf %s "$RAW_ACCOUNT" | tr -d '[:space:]"')"
          echo "token length ${#T} (API tokens are 40), account id length ${#A} (32)"
          curl -s -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c '{success, status: .result.status, errors: [.errors[]?.message]}'
          CLOUDFLARE_API_TOKEN="$T" CLOUDFLARE_ACCOUNT_ID="$A" npx --yes wrangler@4.162.0 deploy
