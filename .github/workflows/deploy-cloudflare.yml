name: Deploy to Cloudflare (Workers static assets)

# Deploys the committed site to the quran-ilmualam Worker. Pushes made by the data/refresh workflows use GITHUB_TOKEN,
# which does not fire "push" events, so those workflows trigger a deploy through workflow_run instead.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Daily refresh (hari ini)", "Prayer times (JAKIM)", "Masjid & surau (OpenStreetMap)"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack site into dist/
        run: tools/cf/pack.sh
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.162.0 deploy
