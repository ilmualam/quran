# Keeps assets/data/solat/ in sync with the official JAKIM timetable, then rebuilds the site so
# /waktu-solat/, /waktu-berbuka-puasa/, /cari-masjid/ and their state/zone pages are pre-rendered with official times and current month facts. Next year's timetable is tried from October so the Ramadan pages switch to official times as soon as JAKIM publishes them. Runs monthly, on demand, and when the fetcher changes.
name: Prayer times (JAKIM)
on:
  schedule:
    - cron: "17 19 1 * *"   # 03:17 MYT on the 2nd of every month
  workflow_dispatch:
    inputs:
      years:
        description: "Years to fetch, space separated (blank = this year)"
        required: false
  push:
    paths:
      - tools/solat_fetch.py
      - .github/workflows/solat-data.yml
permissions:
  contents: write
concurrency:
  group: data-sync-${{ github.ref }}  # shared with masjid-data.yml: one data commit at a time
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}  # the branch tip when this job starts (jobs queue in data-sync), not the triggering commit, so the push fast-forwards
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official timetables
        env:
          YEARS: ${{ github.event.inputs.years }}
        run: |
          Y="$(printf '%s' "$YEARS" | tr -cd '0-9 ')"
          if [ -z "$Y" ]; then Y="$(date -u +%Y)"; [ "$(date -u +%m)" -ge 10 ] && Y="$Y $(( $(date -u +%Y) + 1 ))"; fi
          python3 tools/solat_fetch.py $Y
      - name: Rebuild site
        run: SOLAT_DATE="$(TZ=Asia/Kuala_Lumpur date +%F)" python3 tools/build.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          P="assets/data/solat waktu-solat waktu-berbuka-puasa cari-masjid kalendar-hijrah solat-sunat solat-jamak-qasar asmaul-husna zakat-fitrah sw.js llms.txt sitemap.xml"
          git add $P
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update JAKIM prayer timetables ($(date -u +%F))"
          # another job or a code push may have moved the branch meanwhile: take those commits, rebuild the generated pages on top, retry
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
            SOLAT_DATE="$(TZ=Asia/Kuala_Lumpur date +%F)" python3 tools/build.py
            git add $P
            git commit --amend --no-edit
          done
          exit 1
