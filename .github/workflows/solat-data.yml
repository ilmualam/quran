# Keeps assets/data/solat/ in sync with the official JAKIM timetable, then rebuilds the site so
# /waktu-solat/ and the 15 state pages are pre-rendered with official times and current month facts. Runs monthly, on demand, and when the fetcher changes.
name: Prayer times (JAKIM)
on:
  schedule:
    - cron: "17 19 1 * *"   # 03:17 MYT on the 2nd of every month
  workflow_dispatch:
    inputs:
      years:
        description: "Years to fetch, space separated (blank = this year)"
        required: false
  push:
    paths:
      - tools/solat_fetch.py
      - .github/workflows/solat-data.yml
permissions:
  contents: write
concurrency:
  group: solat-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official timetables
        env:
          YEARS: ${{ github.event.inputs.years }}
        run: |
          Y="$(printf '%s' "$YEARS" | tr -cd '0-9 ')"
          if [ -z "$Y" ]; then Y="$(date -u +%Y)"; [ "$(date -u +%m)" = "12" ] && Y="$Y $(( $(date -u +%Y) + 1 ))"; fi
          python3 tools/solat_fetch.py $Y
      - name: Rebuild site
        run: SOLAT_DATE="$(TZ=Asia/Kuala_Lumpur date +%F)" python3 tools/build.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/solat waktu-solat sw.js llms.txt
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update JAKIM prayer timetables ($(date -u +%F))"
          git push
