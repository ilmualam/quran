<!DOCTYPE html>
<html lang="ms-MY" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="robots" content="{{ROBOTS}}">
<meta name="author" content="The Ilmu Alam">
<meta name="theme-color" content="#0c3808" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08150d" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="{{URL}}">
<link rel="alternate" hreflang="ms-MY" href="{{URL}}">
<link rel="alternate" hreflang="x-default" href="{{URL}}">
{{ICONS}}
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Al-Quran">
<meta name="application-name" content="Al-Quran Online">
{{PRELOAD}}<meta property="og:type" content="{{OGTYPE}}">
<meta property="og:site_name" content="Ilmu Alam">
<meta property="og:locale" content="ms_MY">
<meta property="og:url" content="{{URL}}">
<meta property="og:title" content="{{OGTITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:image" content="{{OGIMG}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{OGTITLE}}">
<meta property="article:modified_time" content="{{TODAY}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@ilmualam">
<meta name="twitter:title" content="{{OGTITLE}}">
<meta name="twitter:description" content="{{DESC}}">
<meta name="twitter:image" content="{{OGIMG}}">
{{ADMETA}}<script>{{THEMEJS}}</script>
<style>{{CSS}}</style>
<script type="application/ld+json">{{JSONLD}}</script>
</head>
<body>
{{HEADER}}
<main id="utama">
{{BODY}}
</main>
{{FOOTER}}
{{DATA}}<script src="/assets/js/quran-home.js" defer></script>
{{SCRIPTS}}</body>
</html>
